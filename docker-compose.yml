services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_MODE: ${APP_MODE:-standalone}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://eq_dashboard:eq_dashboard@db:5432/eq_dashboard}
    volumes:
      - ./app:/app/app
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eq_dashboard
      POSTGRES_PASSWORD: eq_dashboard
      POSTGRES_DB: eq_dashboard
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  db_data:
