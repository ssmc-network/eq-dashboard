<div id="tag-mapping-form-wrap">
  <form class="tag-mapping-form"
        hx-post="{{ ('/ui/tag-mappings/' + mapping.tag_id) if editing else '/ui/tag-mappings' }}"
        hx-target="#tag-mapping-form-wrap"
        hx-swap="innerHTML">
    <h3>{{ t("tag_mappings.form_edit_title") if editing else t("tag_mappings.form_add_title") }}</h3>
    {% if error %}
    <p class="tag-mapping-form__error">{{ error }}</p>
    {% endif %}
    <label>tagId
      <input type="text" name="tag_id" value="{{ mapping.tag_id if mapping else '' }}"
             placeholder="run_state_a" {% if editing %}readonly{% endif %} required>
    </label>
    <label>{{ t("tag_mappings.field_api_field") }}
      <input type="text" name="api_field" value="{{ mapping.api_field if mapping else '' }}"
             placeholder="line_a.transport_a.run_state" required>
    </label>
    <div class="tag-mapping-form__grid">
      <label>{{ t("tag_mappings.field_running_value") }}
        <input type="text" name="running_value" value="{{ mapping.running_value if mapping else '' }}" placeholder="1">
      </label>
      <label>{{ t("tag_mappings.field_stopped_value") }}
        <input type="text" name="stopped_value" value="{{ mapping.stopped_value if mapping else '' }}" placeholder="0">
      </label>
      <label>{{ t("tag_mappings.field_alarm_value") }}
        <input type="text" name="alarm_value" value="{{ mapping.alarm_value if mapping else '' }}" placeholder="9">
      </label>
    </div>
    <div class="tag-mapping-form__actions">
      <button type="submit" class="btn btn--accent">{{ t("tag_mappings.update") if editing else t("tag_mappings.add") }}</button>
      {% if editing %}
      <button type="button" class="btn"
              hx-get="/ui/tag-mappings/new"
              hx-target="#tag-mapping-form-wrap"
              hx-swap="innerHTML">{{ t("common.cancel") }}</button>
      {% endif %}
    </div>
  </form>
</div>
