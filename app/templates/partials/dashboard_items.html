<div class="dashboard-canvas" style="width: {{ floor_map.layout.layout.width }}px; height: {{ floor_map.layout.layout.height }}px;">
  {% for shape in floor_map.shapes %}
  <div class="floor-shape" style="left: {{ shape.x }}px; top: {{ shape.y }}px; width: {{ shape.w }}px; height: {{ shape.h }}px;">
    <span class="floor-shape__label">{{ shape.label }}</span>
  </div>
  {% endfor %}
  {% for marker in floor_map.markers %}
  <div class="eq-marker eq-marker--{{ marker.status_value }}"
       style="left: {{ marker.x }}px; top: {{ marker.y }}px;"
       title="{{ marker.label }} / {{ marker.status_label }} / 更新: {{ marker.updated_at.strftime('%H:%M:%S') }}">
    <span class="eq-marker__dot"></span>
    <span class="eq-marker__label">{{ marker.label }}</span>
  </div>
  {% endfor %}
</div>
