<div class="dashboard-canvas" style="width: {{ layout.layout.width }}px; height: {{ layout.layout.height }}px;">
  {% for box in boxes %}
  <div class="eq-box eq-box--{{ box.status_value }}"
       style="left: {{ box.x }}px; top: {{ box.y }}px; width: {{ box.w }}px; height: {{ box.h }}px;">
    <div class="eq-box__label">{{ box.label }}</div>
    <span class="status-pill status-pill--{{ box.status_value }}">{{ box.status_label }}</span>
    <div class="eq-box__updated">更新: {{ box.updated_at.strftime('%H:%M:%S') }}</div>
  </div>
  {% endfor %}
</div>
