{% extends "base.html" %}
{% block title %}Online設定 - EQ Dashboard{% endblock %}
{% block page_title %}Online設定{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1>Online設定</h1>
    <p>オンラインモードで使用するマスターAPIの接続先、認証方式を管理します。</p>
  </div>
  <a class="btn-link" href="/ui/settings">← システム設定へ</a>
</div>

<div class="card">
  <span class="badge">現在の動作モード: {{ "オンライン" if operation_mode == "online" else "オフライン" }}</span>

  <form class="api-config-form" method="post" action="/ui/api-sources">
    <label>接続先URL
      <input type="text" name="base_url" value="{{ config.base_url }}" placeholder="https://api.example.com">
    </label>

    <fieldset class="auth-type-field">
      <legend>認証方式</legend>
      <label><input type="radio" name="auth_type" value="none" {% if config.auth_type == "none" %}checked{% endif %}> なし</label>
      <label><input type="radio" name="auth_type" value="api_key" {% if config.auth_type == "api_key" %}checked{% endif %}> APIキー</label>
      <label><input type="radio" name="auth_type" value="bearer" {% if config.auth_type == "bearer" %}checked{% endif %}> Bearerトークン</label>
    </fieldset>

    <label>APIキーのヘッダー名
      <input type="text" name="api_key_header" value="{{ config.api_key_header }}" placeholder="X-API-Key">
    </label>
    <label>APIキー / トークン
      <input type="password" name="credential" value="{{ config.credential }}" placeholder="••••••••" autocomplete="off">
    </label>

    <div class="api-config-form__actions">
      <button type="submit" class="btn btn--accent">保存</button>
      <button type="button" class="btn"
              hx-post="/ui/api-sources/test"
              hx-include="closest form"
              hx-target="#api-test-result"
              hx-swap="innerHTML">接続テスト</button>
    </div>
  </form>

  <div id="api-test-result"></div>
</div>
{% endblock %}
