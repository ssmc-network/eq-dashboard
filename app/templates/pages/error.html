{% extends "base.html" %}
{% block title %}{{ t("error.page_title") }} ({{ status_code }}) - {{ t("app.name") }}{% endblock %}
{% block page_title %}{{ t("error.page_title") }}{% endblock %}
{% block content %}
<div class="error-page">
  <span class="error-page__code">{{ status_code }}</span>
  <p class="error-page__message">{{ message }}</p>
  <a class="btn btn--accent" href="/ui/dashboard">{{ t("error.back_to_dashboard") }}</a>
</div>
{% endblock %}
