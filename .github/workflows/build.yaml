name: Build on Merge to Main

on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  build_docker_image_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract release version
        id: extract_version
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          RELEASE_VERSION=$(echo "$COMMIT_MESSAGE" | grep -oP 'from \S+/release/\K\S+' | head -n1)
          if [ -z "$RELEASE_VERSION" ]; then
            echo "Could not extract release version (expected 'Merge pull request #N from <owner>/release/<version>' in the merge commit message)." >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: prd
          push: true
          tags: |
            ${{ github.repository }}:latest
            ${{ github.repository }}:${{ env.RELEASE_VERSION }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max

      - name: Install Docker Scout CLI
        run: curl -fsSL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh | sh -s --

      - name: Scan image with Docker Scout
        run: docker scout cves ${{ github.repository }}:${{ env.RELEASE_VERSION }} --format markdown --output scout-report.md

      - name: Update Docker Scout results issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('scout-report.md', 'utf8');
            const title = '🐳 Docker Scout 脆弱性スキャン結果';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `**最終更新:** ${new Date().toISOString()}`,
              `**対象イメージ:** \`${{ github.repository }}:${{ env.RELEASE_VERSION }}\``,
              `**Workflow run:** ${runUrl}`,
              '',
              report,
              '',
              '<sub>過去の結果は本Issueの編集履歴から確認できます。</sub>',
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'docker-scout',
            });
            const existing = issues.find((issue) => issue.title === title);

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['docker-scout'],
              });
            }
