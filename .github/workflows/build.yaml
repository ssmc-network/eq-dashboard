name: Build on Merge to Main

on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  build_docker_image_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract release version
        id: extract_version
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          RELEASE_VERSION=$(echo "$COMMIT_MESSAGE" | grep -oP 'from \S+/release/\K\S+' | head -n1)
          if [ -z "$RELEASE_VERSION" ]; then
            echo "Could not extract release version (expected 'Merge pull request #N from <owner>/release/<version>' in the merge commit message)." >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: prd
          push: true
          tags: |
            ${{ github.repository }}:latest
            ${{ github.repository }}:${{ env.RELEASE_VERSION }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max

      - name: Install Docker Scout CLI
        run: curl -fsSL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh | sh -s --

      - name: Scan image with Docker Scout
        run: |
          docker scout cves ${{ github.repository }}:${{ env.RELEASE_VERSION }} --format markdown --output scout-report-full.md
          docker scout cves ${{ github.repository }}:${{ env.RELEASE_VERSION }} --only-severity critical,high --format markdown --output scout-report-issue.md

      - name: Upload full Docker Scout report
        uses: actions/upload-artifact@v4
        with:
          name: docker-scout-report-${{ env.RELEASE_VERSION }}
          path: scout-report-full.md
          retention-days: 90

      - name: Update Docker Scout results issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // Issue本文はGitHubの上限(65536文字)があり、medium/lowも含む全件だと
            // 簡単に超える(実際に1回超えて失敗した)。critical/highだけに絞った
            // レポートを本文に載せ、全件は上のステップでArtifactとして保存する。
            // 絞っても超える可能性があるため、念のため文字数でも防御的に切り詰める。
            const MAX_BODY_LENGTH = 60000;
            const title = '🐳 Docker Scout 脆弱性スキャン結果';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const header = [
              `**最終更新:** ${new Date().toISOString()}`,
              `**対象イメージ:** \`${{ github.repository }}:${{ env.RELEASE_VERSION }}\``,
              `**Workflow run:** ${runUrl}`,
              '**表示範囲:** critical/high のみ(medium/lowを含む全件はWorkflow runのArtifact `docker-scout-report-${{ env.RELEASE_VERSION }}` を参照)',
              '',
            ].join('\n');
            const footer = '\n\n<sub>過去の結果は本Issueの編集履歴から確認できます。</sub>';

            let report = fs.readFileSync('scout-report-issue.md', 'utf8');
            const budget = MAX_BODY_LENGTH - header.length - footer.length;
            if (report.length > budget) {
              report = report.slice(0, budget) + '\n\n...(文字数制限のため以降省略。全件はArtifactを参照)';
            }
            const body = header + report + footer;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'docker-scout',
            });
            const existing = issues.find((issue) => issue.title === title);

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['docker-scout'],
              });
            }
